<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <style>
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: #f2f6fb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

#chat {
  background: #ffffff;
  width: 420px;
  max-width: 95%;
  height: 560px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 30px rgba(0,0,0,0.12);
  overflow: hidden;
}

/* Header */
#header {
  background: #0b5ed7;
  color: white;
  padding: 14px;
  font-weight: 600;
  text-align: center;
  font-size: 16px;
}

/* Mensajes */
#messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 80%;
  line-height: 1.4;
  font-size: 15px;
}

/* Usuario */
.user {
  background: #0b5ed7;
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 6px;
}

/* Bot */
.bot {
  background: #e9edf3;
  color: #1f2937;
  align-self: flex-start;
  border-bottom-left-radius: 6px;
}

/* Input */
#input {
  display: flex;
  border-top: 1px solid #e5e7eb;
  padding: 10px;
  background: #f9fafb;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #d1d5db;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #0b5ed7;
}

button {
  margin-left: 8px;
  padding: 0 18px;
  border: none;
  border-radius: 12px;
  background: #0b5ed7;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #084298;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.msg { white-space: pre-wrap; word-wrap: break-word; }
</style>


</head>
<body>

<div id="chat">
  <div id="header">Asistente Clínica Dental</div>
  <div id="messages" aria-live="polite"></div>
  <div id="input">
    <input id="texto" placeholder="Escribe tu mensaje..." maxlength="1000" autocomplete="off" aria-label="Mensaje" />
    <button id="enviarBtn" onclick="enviar()">Enviar</button>
  </div>
</div>

<script>
const API_URL = "https://web-production-e2e34.up.railway.app/chat";

const messages = document.getElementById("messages");
const input = document.getElementById("texto");
const boton = document.getElementById("enviarBtn");

// Identificador de sesión para que el bot recuerde la conversación
let sessionId;
try {
  sessionId = localStorage.getItem("chat_session");
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
    localStorage.setItem("chat_session", sessionId);
  }
} catch {
  sessionId = String(Date.now()) + Math.random().toString(36).slice(2);
}

function agregarMensaje(texto, clase) {
  const div = document.createElement("div");
  div.className = "msg " + clase;
  div.textContent = texto;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function mostrarEscribiendo() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.id = "typing";
  div.textContent = "Escribiendo...";
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function quitarEscribiendo() {
  const typing = document.getElementById("typing");
  if (typing) typing.remove();
}

let enviando = false;

async function enviar() {
  const texto = input.value.trim();
  if (!texto || enviando) return;

  enviando = true;
  boton.disabled = true;
  agregarMensaje(texto, "user");
  input.value = "";

  mostrarEscribiendo();

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto, session_id: sessionId })
    });

    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    quitarEscribiendo();
    agregarMensaje(data.mensaje, "bot");
  } catch {
    quitarEscribiendo();
    agregarMensaje("Ha ocurrido un error. Inténtelo más tarde.", "bot");
  } finally {
    enviando = false;
    boton.disabled = false;
    input.focus();
  }
}

agregarMensaje("Hola 😊 Soy el asistente de la Clínica Dental Sonrisa. ¿En qué puedo ayudarte?", "bot");

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) enviar();
});
</script>


</body>
</html>
